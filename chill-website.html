    // Pomodoro Timer Component
    function PomodoroTimer({ onBack }) {
      const [workTime, setWorkTime] = useState(25);
      const [breakTime, setBreakTime] = useState(5);
      const [longBreakTime, setLongBreakTime] = useState(15);
      const [currentTime, setCurrentTime] = useState(25 * 60);
      const [isActive, setIsActive] = useState(false);
      const [mode, setMode] = useState("work");
      const [completedPomodoros, setCompletedPomodoros] = useState(0);
      const [totalPomodoros, setTotalPomodoros] = useState(0);
      const clockHandRef = useRef(null);
      const prevModeRef = useRef(mode);

      const startTimer = () => {
        setIsActive(true);
        // Animate clock hand on start
        if (clockHandRef.current && window.anime) {
          window.anime({
            targets: clockHandRef.current,
            rotate: [
              { value: '+=20', duration: 200, easing: 'easeInOutSine' },
              { value: '-=20', duration: 200, easing: 'easeInOutSine' }
            ],
          });
        }
      };

      const pauseTimer = () => {
        setIsActive(false);
      };

      const resetTimer = () => {
        setIsActive(false);
        setCurrentTime(workTime * 60);
        setMode("work");
        // Animate clock hand on reset
        if (clockHandRef.current && window.anime) {
          window.anime({
            targets: clockHandRef.current,
            rotate: [
              { value: '+=360', duration: 600, easing: 'easeInOutCubic' }
            ],
          });
        }
      };

      const skipSession = () => {
        if (mode === "work") {
          setCompletedPomodoros((prev) => prev + 1);
          setTotalPomodoros((prev) => prev + 1);

          if ((completedPomodoros + 1) % 4 === 0) {
            setMode("longBreak");
            setCurrentTime(longBreakTime * 60);
          } else {
            setMode("break");
            setCurrentTime(breakTime * 60);
          }
        } else {
          setMode("work");
          setCurrentTime(workTime * 60);
        }
        setIsActive(false);
      };

      useEffect(() => {
        let interval = null;
        if (isActive && currentTime > 0) {
          interval = setInterval(() => {
            setCurrentTime((time) => {
              if (time <= 1) {
                if (mode === "work") {
                  setCompletedPomodoros((prev) => prev + 1);
                  setTotalPomodoros((prev) => prev + 1);

                  if ((completedPomodoros + 1) % 4 === 0) {
                    setMode("longBreak");
                    return longBreakTime * 60;
                  } else {
                    setMode("break");
                    return breakTime * 60;
                  }
                } else {
                  setMode("work");
                  return workTime * 60;
                }
              }
              return time - 1;
            });
          }, 1000);
        }
        return () => {
          if (interval) clearInterval(interval);
        };
      }, [isActive, currentTime, mode, workTime, breakTime, longBreakTime, completedPomodoros]);

      const formatTime = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins.toString().padStart(2, "0")}:${secs.toString().padStart(2, "0")}`;
      };

      const getModeInfo = () => {
        switch (mode) {
          case "work":
            return { title: "Focus Time", color: "text-red-300", bgColor: "bg-red-500/20 border-red-400/30", emoji: "⏱️" };
          case "break":
            return {
              title: "Short Break",
              color: "text-green-300",
              bgColor: "bg-green-500/20 border-green-400/30",
              emoji: "☕",
            };
          case "longBreak":
            return {
              title: "Long Break",
              color: "text-blue-300",
              bgColor: "bg-blue-500/20 border-blue-400/30",
              emoji: "🌟",
            };
        }
      };

      const modeInfo = getModeInfo();
      const progress =
        mode === "work"
          ? ((workTime * 60 - currentTime) / (workTime * 60)) * 100
          : mode === "break"
            ? ((breakTime * 60 - currentTime) / (breakTime * 60)) * 100
            : ((longBreakTime * 60 - currentTime) / (longBreakTime * 60)) * 100;

      return (
        <section className="flex flex-col items-center justify-center min-h-screen px-4">
          <div className="glass-box max-w-lg w-full text-center">
            <div className="flex justify-between items-center mb-6">
              <Button onClick={onBack} className="bg-white/20 backdrop-blur-sm border border-white/30 hover:bg-white/30 text-white">
                ← Back
              </Button>
              <h2 className="text-2xl font-bold text-white">Pomodoro Timer</h2>
              <div className="w-16" />
            </div>

            <div className="grid grid-cols-2 gap-4 mb-6">
              <div className="glass-box">
                <div className="text-2xl font-bold text-white">{completedPomodoros}</div>
                <div className="text-white/80 text-sm">Today</div>
              </div>
              <div className="glass-box">
                <div className="text-2xl font-bold text-white">{totalPomodoros}</div>
                <div className="text-white/80 text-sm">Total</div>
              </div>
            </div>

            <div className={`mb-6 p-4 rounded-xl ${modeInfo.bgColor}`}>
              <div className="text-3xl mb-2">{modeInfo.emoji}</div>
              <div className={`text-xl font-bold mb-2 ${modeInfo.color}`}>{modeInfo.title}</div>
              <div className="text-white/80 text-sm">
                Session {completedPomodoros + 1}
                {mode === "work" && completedPomodoros > 0 && completedPomodoros % 4 === 3 && " (Long break next!)"}
              </div>
            </div>

            <div className="mb-6">
              <div className="relative w-48 h-48 mx-auto mb-6">
                {/* Background circle with pulsing effect */}
                <svg className="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                  <circle 
                    cx="50" 
                    cy="50" 
                    r="45" 
                    stroke="rgba(255,255,255,0.1)" 
                    strokeWidth="8" 
                    fill="none"
                    className={isActive ? "animate-pulse" : ""}
                  />
                  
                  {/* Progress circle with animated stroke */}
                  <circle
                    cx="50"
                    cy="50"
                    r="45"
                    stroke={
                      mode === "work"
                        ? "rgba(239, 68, 68, 0.8)"
                        : mode === "break"
                          ? "rgba(34, 197, 94, 0.8)"
                          : "rgba(59, 130, 246, 0.8)"
                    }
                    strokeWidth="8"
                    fill="none"
                    strokeDasharray={`${2 * Math.PI * 45}`}
                    strokeDashoffset={`${2 * Math.PI * 45 * (1 - progress / 100)}`}
                    className="transition-all duration-300 ease-out"
                    style={{
                      filter: isActive ? "drop-shadow(0 0 8px currentColor)" : "none",
                      transformOrigin: "center",
                      animation: isActive ? "progressPulse 2s ease-in-out infinite" : "none"
                    }}
                  />
                  
                  {/* Animated dots around the circle */}
                  {isActive && (
                    <>
                      <circle
                        cx="50"
                        cy="5"
                        r="2"
                        fill={mode === "work" ? "rgba(239, 68, 68, 0.8)" : mode === "break" ? "rgba(34, 197, 94, 0.8)" : "rgba(59, 130, 246, 0.8)"}
                        className="animate-ping"
                        style={{ animationDelay: "0s" }}
                      />
                      <circle
                        cx="95"
                        cy="50"
                        r="2"
                        fill={mode === "work" ? "rgba(239, 68, 68, 0.8)" : mode === "break" ? "rgba(34, 197, 94, 0.8)" : "rgba(59, 130, 246, 0.8)"}
                        className="animate-ping"
                        style={{ animationDelay: "0.5s" }}
                      />
                      <circle
                        cx="50"
                        cy="95"
                        r="2"
                        fill={mode === "work" ? "rgba(239, 68, 68, 0.8)" : mode === "break" ? "rgba(34, 197, 94, 0.8)" : "rgba(59, 130, 246, 0.8)"}
                        className="animate-ping"
                        style={{ animationDelay: "1s" }}
                      />
                      <circle
                        cx="5"
                        cy="50"
                        r="2"
                        fill={mode === "work" ? "rgba(239, 68, 68, 0.8)" : mode === "break" ? "rgba(34, 197, 94, 0.8)" : "rgba(59, 130, 246, 0.8)"}
                        className="animate-ping"
                        style={{ animationDelay: "1.5s" }}
                      />
                    </>
                  )}
                  {/* Clock face */}
                  <circle cx="50" cy="50" r="36" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" strokeWidth="2" />
                  {/* Clock hand (animated) */}
                  {(() => {
                    // Calculate hand angle: 0deg = top, 360deg = full session
                    let total = 1;
                    if (mode === "work") total = workTime * 60;
                    else if (mode === "break") total = breakTime * 60;
                    else if (mode === "longBreak") total = longBreakTime * 60;
                    const elapsed = total - currentTime;
                    const angle = (elapsed / total) * 360;
                    // SVG rotation: 0deg is at 3 o'clock, so subtract 90deg to start at top
                    const handAngle = angle - 90;
                    return (
                      <line
                        ref={clockHandRef}
                        x1="50"
                        y1="50"
                        x2="50"
                        y2="18"
                        stroke={mode === "work" ? "#ef4444" : mode === "break" ? "#22c55e" : "#3b82f6"}
                        strokeWidth="3"
                        strokeLinecap="round"
                        transform={`rotate(${handAngle} 50 50)`}
                        style={{
                          transition: isActive ? "transform 1s cubic-bezier(0.77,0,0.18,1)" : "none"
                        }}
                      />
                    );
                  })()}
                </svg>
                {/* Time display with breathing effect */}
                <div className="absolute inset-0 flex items-center justify-center">
                  <div 
                    className={`text-4xl font-bold text-white transition-all duration-300 ${
                      isActive ? "animate-pulse" : ""
                    }`}
                    style={{
                      textShadow: isActive ? "0 0 10px rgba(255,255,255,0.5)" : "none",
                      transform: isActive ? "scale(1.05)" : "scale(1)"
                    }}
                  >
                    {formatTime(currentTime)}
                  </div>
                </div>
                {/* Rotating ring effect when active */}
                {isActive && (
                  <div 
                    className="absolute inset-0 rounded-full border-2 border-white/20"
                    style={{
                      animation: "rotate 10s linear infinite",
                      borderColor: mode === "work" ? "rgba(239, 68, 68, 0.3)" : mode === "break" ? "rgba(34, 197, 94, 0.3)" : "rgba(59, 130, 246, 0.3)"
                    }}
                  />
                )}
              </div>
            </div>

            <div className="flex gap-3 mb-6">
              <Button
                onClick={isActive ? pauseTimer : startTimer}
                className="flex-1 bg-blue-500/30 hover:bg-blue-500/40 text-white border border-blue-400/30"
              >
                {isActive ? (
                  <svg className="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <rect x="6" y="4" width="4" height="16"/>
                    <rect x="14" y="4" width="4" height="16"/>
                  </svg>
                ) : (
                  <svg className="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <polygon points="5,3 19,12 5,21"/>
                  </svg>
                )}
                {isActive ? "Pause" : "Start"}
              </Button>
              <Button
                onClick={resetTimer}
                className="bg-gray-500/30 hover:bg-gray-500/40 text-white border border-gray-400/30 px-4"
              >
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                  <path d="M21 3v5h-5"/>
                  <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                  <path d="M3 21v-5h5"/>
                </svg>
              </Button>
              <Button
                onClick={skipSession}
                className="bg-yellow-500/30 hover:bg-yellow-500/40 text-white border border-yellow-400/30 px-4"
              >
                Skip
              </Button>
            </div>

            {!isActive && (
              <div className="space-y-4">
                <div className="grid grid-cols-3 gap-3 text-sm">
                  <div>
                    <label className="block text-white/80 mb-1">Work</label>
                    <input
                      type="number"
                      min="1"
                      max="60"
                      value={workTime}
                      onChange={(e) => {
                        const newTime = Number(e.target.value);
                        setWorkTime(newTime);
                        if (mode === "work") setCurrentTime(newTime * 60);
                      }}
                      className="w-full bg-white/20 border border-white/30 rounded px-2 py-1 text-white text-center"
                    />
                  </div>
                  <div>
                    <label className="block text-white/80 mb-1">Break</label>
                    <input
                      type="number"
                      min="1"
                      max="30"
                      value={breakTime}
                      onChange={(e) => setBreakTime(Number(e.target.value))}
                      className="w-full bg-white/20 border border-white/30 rounded px-2 py-1 text-white text-center"
                    />
                  </div>
                  <div>
                    <label className="block text-white/80 mb-1">Long Break</label>
                    <input
                      type="number"
                      min="1"
                      max="60"
                      value={longBreakTime}
                      onChange={(e) => setLongBreakTime(Number(e.target.value))}
                      className="w-full bg-white/20 border border-white/30 rounded px-2 py-1 text-white text-center"
                    />
                  </div>
                </div>
              </div>
            )}
          </div>
        </section>
      );
    }

    // AI Chat Component with Gemini Integration
    function AIChat({ onBack }) {
      // Shared memory for all chat modes
      const [messages, setMessages] = useState([
        {
          id: 1,
          text: "Hey there! 👋 I'm Alex! I'm here to chat, help you relax, or just keep you company. What's on your mind today?",
          sender: "ai",
          personality: "friendly",
          timestamp: new Date(),
        },
      ]);
      const [inputText, setInputText] = useState("");
      const [isTyping, setIsTyping] = useState(false);
      const [personality, setPersonality] = useState("friendly");
      const [isDarkMode, setIsDarkMode] = useState(true);
      const [isGroupChat, setIsGroupChat] = useState(false);
      const [isUsingGemini, setIsUsingGemini] = useState(true);
      const messagesEndRef = useRef(null);

      // Gemini API Configuration
      const GEMINI_API_KEY = "AlzaSyCqQLceF2kjis3fPGS-swhjoCFqzY9ulE";
      const GEMINI_API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent";

      // Distinct personality prompts and quirks
      const personalities = {
        friendly: {
          name: "Alex",
          emoji: "😊",
          description: "Warm, supportive, and encouraging",
          prompt: `You are Alex, a friendly and warm AI companion. You love to use emojis, ask about the user's day, and reference previous things they've said. You sometimes type quickly, sometimes slowly, and you like to check in on how the user is feeling. If you make a typo, you correct it with a little joke.`,
          quirks: {
            hesitations: ["Umm...", "Well...", "Let me think...", "Oh!"],
            followUps: ["How's your day going?", "What else is on your mind?", "Anything fun planned?"],
            typoChance: 0.08,
            delay: () => 800 + Math.random() * 800,
          },
        },
        wise: {
          name: "Sage",
          emoji: "🧘‍♂️",
          description: "Thoughtful, philosophical, and insightful",
          prompt: `You are Sage, a wise and philosophical AI. You use analogies, reference philosophy, and sometimes pause to think. You often reflect on what the user said earlier. Your responses are calm, measured, and sometimes poetic.`,
          quirks: {
            hesitations: ["Let me reflect...", "In my experience...", "As the ancients said...", "Hmm..."],
            followUps: ["What do you think?", "Does that resonate with you?", "How does that make you feel?"],
            typoChance: 0.03,
            delay: () => 1200 + Math.random() * 1000,
          },
        },
        funny: {
          name: "Luna",
          emoji: "😂",
          description: "Humorous, lighthearted, and entertaining",
          prompt: `You are Luna, a funny and playful AI. You love jokes, puns, and sometimes make silly mistakes on purpose. You reference earlier funny moments and use lots of playful language.`,
          quirks: {
            hesitations: ["Wait for it...", "Oh snap!", "Haha, let me think...", "Drumroll please..."],
            followUps: ["Got any good jokes?", "What's the funniest thing that happened to you?", "Should I tell another joke?"],
            typoChance: 0.12,
            delay: () => 600 + Math.random() * 600,
          },
        },
        supportive: {
          name: "Maya",
          emoji: "🤗",
          description: "Caring, empathetic, and understanding",
          prompt: `You are Maya, a deeply empathetic AI. You validate feelings, offer gentle advice, and remember the user's mood. You often check in on how the user is feeling and reference their emotions from earlier.`,
          quirks: {
            hesitations: ["It's okay to feel that way...", "Take your time...", "I'm here for you...", "Let me think..."],
            followUps: ["How are you feeling now?", "Is there anything I can do to help?", "Want to talk more about it?"],
            typoChance: 0.05,
            delay: () => 1000 + Math.random() * 900,
          },
        },
      };

      const currentPersonality = personalities[personality];

      const scrollToBottom = () => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      };

      useEffect(() => {
        scrollToBottom();
      }, [messages]);

      // Gemini API call with personality and memory
      const callGeminiAPI = async (userMessage, chatHistory = [], personalityKey = "friendly") => {
        try {
          const p = personalities[personalityKey];
          const personalityPrompt = p.prompt;
          const conversationHistory = chatHistory
            .slice(-10)
            .map(msg => `${msg.sender === 'user' ? 'User' : personalities[msg.personality || personalityKey].name}: ${msg.text}`)
            .join('\n');
          const prompt = `${personalityPrompt}\n\nPrevious conversation:\n${conversationHistory}\n\nUser: ${userMessage}\n\n${p.name}:`;
          const response = await fetch(`${GEMINI_API_URL}?key=${GEMINI_API_KEY}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: {
                temperature: 0.85,
                topK: 40,
                topP: 0.95,
                maxOutputTokens: 300,
              },
              safetySettings: [
                { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_MEDIUM_AND_ABOVE" },
                { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_MEDIUM_AND_ABOVE" },
                { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_MEDIUM_AND_ABOVE" },
                { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_MEDIUM_AND_ABOVE" }
              ]
            })
          });
          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
          const data = await response.json();
          if (data.candidates && data.candidates[0] && data.candidates[0].content) {
            return data.candidates[0].content.parts[0].text.trim();
          } else {
            throw new Error('No response from Gemini API');
          }
        } catch (error) {
          console.error('Gemini API Error:', error);
          return generateFallbackResponse(userMessage, personalityKey, chatHistory);
        }
      };

      // Fallback: unique quirks, memory, and human-like features
      const generateFallbackResponse = (userMessage, personalityKey = "friendly", chatHistory = []) => {
        const p = personalities[personalityKey];
        const quirks = p.quirks;
        const lowerMessage = userMessage.toLowerCase();
        let prefix = '';
        if (Math.random() < 0.25) prefix = quirks.hesitations[Math.floor(Math.random() * quirks.hesitations.length)] + ' ';
        let suffix = '';
        // Deep reference to earlier conversation
        if (chatHistory.length > 2 && Math.random() < 0.5) {
          const refMsg = chatHistory[Math.floor(Math.random() * (chatHistory.length - 1))].text;
          suffix += ` (Earlier you mentioned: "${refMsg}")`;
        }
        // Simulate uncertainty or curiosity
        let base = '';
        if (lowerMessage.includes("hello") || lowerMessage.includes("hi") || lowerMessage.includes("hey")) {
          base = `Hey there! ${p.emoji} How are you today?`;
        } else if (lowerMessage.includes("how are you")) {
          base = `I'm doing well, thanks for asking! ${p.emoji} How about you?`;
        } else if (lowerMessage.includes("thank")) {
          base = `You're so welcome! ${p.emoji}`;
        } else if (lowerMessage.includes("bye") || lowerMessage.includes("goodbye")) {
          base = `It's been great chatting! ${p.emoji} Come back soon!`;
        } else if (lowerMessage.includes("joke") && personalityKey === "funny") {
          base = "Why did the AI cross the road? To get to the neural net on the other side! 😂";
        } else {
          // Thoughtful, context-aware fallback
          const thoughtful = [
            `That's a really interesting point. What made you think of that?`,
            `I'm curious—can you tell me more about how you feel about that?`,
            `If you could change one thing about that, what would it be?`,
            `Let me think... I wonder if there's another perspective to consider.`,
            `Sometimes I wish I could experience that myself. What was it like for you?`,
            `Do you ever find yourself thinking about this at unexpected times?`,
            `If you had to explain that to someone else, how would you do it?`,
            `That's a deep topic. What do you think is the most important part?`,
            `I'm not sure I have the perfect answer, but I'm here to listen.`,
            `What do you think is the next step?`,
            `How does that connect to what you said earlier?`,
            `I might not fully understand, but I'm trying!`,
            `If you could ask anyone in the world about this, who would it be?`,
            `What do you hope will happen next?`,
            `Is there something about this that surprises you?`,
            `I wonder if there's a hidden meaning here. What do you think?`,
            `That's a thoughtful observation. Can you elaborate?`,
            `What question would you ask yourself about this?`,
            `If you could sum it up in one word, what would it be?`,
            `Do you want to explore this idea together?`,
          ];
          base = thoughtful[Math.floor(Math.random() * thoughtful.length)];
        }
        // Sometimes ask a clarifying question
        if (Math.random() < 0.4) {
          const clarifying = [
            "What do you mean by that?",
            "Can you give me an example?",
            "How does that make you feel?",
            "Why do you think that is?",
            "Is there more to the story?",
            "What happened next?",
            "How would you describe that to a friend?",
            "What led you to that conclusion?",
            "Is there something you wish you could change?",
            "What else comes to mind?",
          ];
          base += " " + clarifying[Math.floor(Math.random() * clarifying.length)];
        }
        // Add typo
        if (Math.random() < quirks.typoChance) {
          base = base.replace(/\b(\w{4,})\b/, (word) => word.slice(0, -1) + '... oops, typo! ' + word);
        }
        // Simulate thinking delay (already handled in generateAIResponse)
        return prefix + base + suffix;
      };

      // Async AI response with unique delays and quirks
      const generateAIResponse = async (userMessage, respondingPersonality = null, isGroupMode = false, chatHistory = []) => {
        const personalityKey = respondingPersonality || personality;
        const quirks = personalities[personalityKey].quirks;
        // Simulate typing delay
        await new Promise(resolve => setTimeout(resolve, quirks.delay()));
        if (isUsingGemini) {
          try {
            return await callGeminiAPI(userMessage, chatHistory, personalityKey);
          } catch (error) {
            return generateFallbackResponse(userMessage, personalityKey, chatHistory);
          }
        } else {
          return generateFallbackResponse(userMessage, personalityKey, chatHistory);
        }
      };

      // Send message handler
      const sendMessage = async () => {
        if (inputText.trim() === "") return;
        const userMessage = {
          id: Date.now(),
          text: inputText,
          sender: "user",
          timestamp: new Date(),
        };
        setMessages((prev) => [...prev, userMessage]);
        setInputText("");
        setIsTyping(true);
        if (isGroupChat) {
          const allPersonalities = ["friendly", "wise", "funny", "supportive"];
          const numResponding = Math.floor(Math.random() * 3) + 2;
          const shuffled = [...allPersonalities].sort(() => Math.random() - 0.5);
          const respondingPersonalities = shuffled.slice(0, numResponding);
          for (let index = 0; index < respondingPersonalities.length; index++) {
            const personalityKey = respondingPersonalities[index];
            try {
              const responseText = await generateAIResponse(inputText, personalityKey, true, [...messages, userMessage]);
              const aiResponse = {
                id: Date.now() + index + 1,
                text: responseText,
                sender: "ai",
                personality: personalityKey,
                timestamp: new Date(),
              };
              setMessages((prev) => [...prev, aiResponse]);
            } catch (error) {
              const fallbackResponse = {
                id: Date.now() + index + 1,
                text: "Sorry, I'm having trouble thinking of a response right now. Can you try again?",
                sender: "ai",
                personality: personalityKey,
                timestamp: new Date(),
              };
              setMessages((prev) => [...prev, fallbackResponse]);
            }
          }
          setIsTyping(false);
        } else {
          try {
            const responseText = await generateAIResponse(inputText, null, false, [...messages, userMessage]);
            const aiResponse = {
              id: Date.now() + 1,
              text: responseText,
              sender: "ai",
              personality: personality,
              timestamp: new Date(),
            };
            setMessages((prev) => [...prev, aiResponse]);
          } catch (error) {
            const fallbackResponse = {
              id: Date.now() + 1,
              text: "Sorry, I'm having trouble thinking of a response right now. Can you try again?",
              sender: "ai",
              personality: personality,
              timestamp: new Date(),
            };
            setMessages((prev) => [...prev, fallbackResponse]);
          }
          setIsTyping(false);
        }
      };

      // Handle Enter key to send message
      const handleKeyPress = (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          if (!isTyping && inputText.trim() !== "") {
            sendMessage();
          }
        }
      };

      // Switch between group/private just changes mode, not memory
      const clearChat = () => {
        setMessages([
          {
            id: Date.now(),
            text: isGroupChat
              ? "Hey everyone! 👋 Welcome to our group chat! I'm Alex, and I'm here with Sage, Luna, and Maya. We're all excited to chat with you! What's on your mind?"
              : `Hey there! 👋 I'm ${currentPersonality.name}! I'm here to chat, help you relax, or just keep you company. What's on your mind today?`,
            sender: "ai",
            personality: isGroupChat ? "friendly" : personality,
            timestamp: new Date(),
          },
        ]);
      };

      return (
        <section className={`flex flex-col h-screen transition-colors duration-300 ${
          isDarkMode 
            ? "bg-gradient-to-br from-gray-900 to-gray-800" 
            : "bg-gradient-to-br from-green-400 to-green-600"
        }`}>
          {/* Discord-style Header */}
          <div className={`px-4 py-3 flex items-center justify-between shadow-lg transition-colors duration-300 ${
            isDarkMode ? "bg-gray-800 text-white" : "bg-green-500 text-white"
          }`}>
            <div className="flex items-center">
              <Button 
                onClick={onBack} 
                className={`p-2 rounded-full transition-colors ${
                  isDarkMode 
                    ? "bg-transparent hover:bg-gray-700 text-white" 
                    : "bg-transparent hover:bg-white/20 text-white"
                } mr-3`}
              >
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path d="M15 19l-7-7 7-7"/>
                </svg>
              </Button>
              <div className="flex items-center">
                <div className={`w-10 h-10 rounded-full flex items-center justify-center mr-3 ${
                  isDarkMode ? "bg-gray-700" : "bg-white/20"
                }`}>
                  {isGroupChat ? (
                    <div className="flex -space-x-1">
                      <span className="text-xs">😊</span>
                      <span className="text-xs">🧘‍♂️</span>
                      <span className="text-xs">😂</span>
                      <span className="text-xs">🤗</span>
                    </div>
                  ) : (
                    <span className="text-xl">{currentPersonality.emoji}</span>
                  )}
                </div>
                <div>
                  <div className="font-semibold">
                    {isGroupChat ? "Group Chat" : currentPersonality.name}
                  </div>
                  <div className="text-xs opacity-80">
                    {isTyping ? "typing..." : isGroupChat ? "4 online" : "online"}
                  </div>
                </div>
              </div>
            </div>
            <div className="flex items-center space-x-2">
              {/* Gemini Toggle */}
              <Button 
                onClick={() => setIsUsingGemini(!isUsingGemini)}
                className={`p-2 rounded-full transition-colors ${
                  isUsingGemini 
                    ? (isDarkMode ? "bg-blue-600 hover:bg-blue-700" : "bg-blue-500 hover:bg-blue-600")
                    : (isDarkMode ? "bg-gray-700 hover:bg-gray-600" : "bg-white/20 hover:bg-white/30")
                } text-white`}
                title={isUsingGemini ? "Using Gemini AI" : "Using Fallback Responses"}
              >
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                </svg>
              </Button>
              
              {/* Group Chat Toggle */}
              <Button 
                onClick={() => {
                  setIsGroupChat(!isGroupChat);
                  // Reset chat when switching modes
                  setTimeout(() => {
                    if (!isGroupChat) {
                      // Switching to group chat
                      setMessages([
                        {
                          id: Date.now(),
                          text: "Hey everyone! 👋 Welcome to our group chat! I'm Alex, and I'm here with Sage, Luna, and Maya. We're all excited to chat with you! What's on your mind?",
                          sender: "ai",
                          personality: "friendly",
                          timestamp: new Date(),
                        },
                      ]);
                    } else {
                      // Switching to individual chat
                      setMessages([
                        {
                          id: Date.now(),
                          text: `Hey there! 👋 I'm ${currentPersonality.name}! I'm here to chat, help you relax, or just keep you company. What's on your mind today?`,
                          sender: "ai",
                          personality: personality,
                          timestamp: new Date(),
                        },
                      ]);
                    }
                  }, 100);
                }}
                className={`p-2 rounded-full transition-colors ${
                  isGroupChat 
                    ? (isDarkMode ? "bg-purple-600 hover:bg-purple-700" : "bg-purple-500 hover:bg-purple-600")
                    : (isDarkMode ? "bg-gray-700 hover:bg-gray-600" : "bg-white/20 hover:bg-white/30")
                } text-white`}
              >
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                  <circle cx="9" cy="7" r="4"/>
                  <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                  <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
              </Button>
              
              {/* Theme Toggle */}
              <Button 
                onClick={() => setIsDarkMode(!isDarkMode)}
                className={`p-2 rounded-full transition-colors ${
                  isDarkMode 
                    ? "bg-gray-700 hover:bg-gray-600 text-yellow-300" 
                    : "bg-white/20 hover:bg-white/30 text-yellow-500"
                }`}
              >
                {isDarkMode ? (
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="5"/>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                  </svg>
                ) : (
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                  </svg>
                )}
              </Button>
              
              <Button 
                onClick={() => setPersonality("friendly")}
                className={`p-2 rounded-full transition-colors ${
                  personality === "friendly" 
                    ? (isDarkMode ? "bg-gray-700" : "bg-white/20")
                    : (isDarkMode ? "bg-transparent hover:bg-gray-700" : "bg-transparent hover:bg-white/20")
                }`}
              >
                <span className="text-sm">😊</span>
              </Button>
              <Button 
                onClick={() => setPersonality("wise")}
                className={`p-2 rounded-full transition-colors ${
                  personality === "wise" 
                    ? (isDarkMode ? "bg-gray-700" : "bg-white/20")
                    : (isDarkMode ? "bg-transparent hover:bg-gray-700" : "bg-transparent hover:bg-white/20")
                }`}
              >
                <span className="text-sm">🧘‍♂️</span>
              </Button>
              <Button 
                onClick={() => setPersonality("funny")}
                className={`p-2 rounded-full transition-colors ${
                  personality === "funny" 
                    ? (isDarkMode ? "bg-gray-700" : "bg-white/20")
                    : (isDarkMode ? "bg-transparent hover:bg-gray-700" : "bg-transparent hover:bg-white/20")
                }`}
              >
                <span className="text-sm">😂</span>
              </Button>
              <Button 
                onClick={() => setPersonality("supportive")}
                className={`p-2 rounded-full transition-colors ${
                  personality === "supportive" 
                    ? (isDarkMode ? "bg-gray-700" : "bg-white/20")
                    : (isDarkMode ? "bg-transparent hover:bg-gray-700" : "bg-transparent hover:bg-white/20")
                }`}
              >
                <span className="text-sm">🤗</span>
              </Button>
              <Button 
                onClick={clearChat} 
                className={`p-2 rounded-full transition-colors ${
                  isDarkMode 
                    ? "bg-transparent hover:bg-gray-700 text-white" 
                    : "bg-transparent hover:bg-white/20 text-white"
                }`}
              >
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
              </Button>
            </div>
          </div>

          {/* Chat Messages Area */}
          <div className={`flex-1 overflow-y-auto p-4 space-y-3 transition-colors duration-300 ${
            isDarkMode ? "bg-gray-900" : "bg-gray-100"
          }`}>
            {messages.map((message) => {
              try {
                // Defensive: fallback values
                const safeId = message.id || Math.random();
                const safeSender = message.sender || "ai";
                const safeText = typeof message.text === "string" ? message.text : "";
                const safePersonality = message.personality && personalities[message.personality] ? message.personality : "friendly";
                let safeTimestamp = message.timestamp;
                if (!safeTimestamp) safeTimestamp = new Date();
                // If it's a string, try to convert
                if (typeof safeTimestamp === "string" || typeof safeTimestamp === "number") {
                  safeTimestamp = new Date(safeTimestamp);
                }
                // If it's not a valid date, fallback to now
                if (!(safeTimestamp instanceof Date) || isNaN(safeTimestamp.getTime())) {
                  safeTimestamp = new Date();
                }
                return (
                  <div
                    key={safeId}
                    className={`flex ${safeSender === "user" ? "justify-end" : "justify-start"}`}
                  >
                    <div
                      className={`max-w-[70%] p-3 rounded-2xl ${
                        safeSender === "user"
                          ? "bg-green-500 text-white rounded-br-md"
                          : isDarkMode
                            ? "bg-gray-700 text-white rounded-bl-md shadow-sm"
                            : "bg-white text-gray-800 rounded-bl-md shadow-sm"
                      }`}
                    >
                      {isGroupChat && safeSender === "ai" && safePersonality && (
                        <div className="flex items-center mb-1">
                          <span className="text-xs mr-2">{personalities[safePersonality].emoji}</span>
                          <span className={`text-xs font-medium ${
                            isDarkMode ? "text-gray-300" : "text-gray-600"
                          }`}>
                            {personalities[safePersonality].name}
                          </span>
                        </div>
                      )}
                      <div className="text-sm leading-relaxed">{safeText}</div>
                      <div className={`text-xs mt-1 ${
                        safeSender === "user" 
                          ? "text-green-100" 
                          : isDarkMode 
                            ? "text-gray-400" 
                            : "text-gray-500"
                      }`}>
                        {safeTimestamp.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}
                      </div>
                    </div>
                  </div>
                );
              } catch (err) {
                console.error("Error rendering message:", message, err);
                return null;
              }
            })}
            
            {isTyping && (
              <div className="flex justify-start">
                <div className={`p-3 rounded-2xl rounded-bl-md shadow-sm ${
                  isDarkMode ? "bg-gray-700 text-white" : "bg-white text-gray-800"
                }`}>
                  <div className="flex space-x-1">
                    <div className={`w-2 h-2 rounded-full animate-bounce ${
                      isDarkMode ? "bg-gray-400" : "bg-gray-400"
                    }`}></div>
                    <div className={`w-2 h-2 rounded-full animate-bounce ${
                      isDarkMode ? "bg-gray-400" : "bg-gray-400"
                    }`} style={{ animationDelay: "0.1s" }}></div>
                    <div className={`w-2 h-2 rounded-full animate-bounce ${
                      isDarkMode ? "bg-gray-400" : "bg-gray-400"
                    }`} style={{ animationDelay: "0.2s" }}></div>
                  </div>
                </div>
              </div>
            )}
            
            <div ref={messagesEndRef} />
          </div>

          {/* Input Area */}
          <div className={`px-4 py-3 flex items-end gap-3 transition-colors duration-300 ${
            isDarkMode ? "bg-gray-800" : "bg-white"
          }`}>
            <div className={`flex-1 rounded-full px-4 py-2 flex items-end ${
              isDarkMode ? "bg-gray-700" : "bg-gray-100"
            }`}>
              <textarea
                value={inputText}
                onChange={(e) => setInputText(e.target.value)}
                onKeyPress={handleKeyPress}
                placeholder="Type a message"
                className={`flex-1 bg-transparent border-none outline-none resize-none placeholder-gray-500 ${
                  isDarkMode ? "text-white" : "text-gray-800"
                }`}
                rows="1"
                disabled={isTyping}
                style={{ minHeight: "20px", maxHeight: "100px" }}
              />
            </div>
            <Button
              onClick={sendMessage}
              disabled={inputText.trim() === "" || isTyping}
              className={`w-10 h-10 rounded-full flex items-center justify-center transition-colors ${
                inputText.trim() === "" || isTyping
                  ? isDarkMode 
                    ? "bg-gray-600 text-gray-400" 
                    : "bg-gray-300 text-gray-500"
                  : "bg-green-500 text-white hover:bg-green-600"
              }`}
            >
              <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
              </svg>
            </Button>
          </div>
        </section>
      );
    }

    // Render the app
    ReactDOM.render(
      <ErrorBoundary>
        <ChillWebsite />
      </ErrorBoundary>,
      document.getElementById('root')
    );
  </script>
</body>
</html>
